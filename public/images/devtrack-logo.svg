<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dtTealGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <linearGradient id="dtTealGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="40%" stop-color="#14b8a6" />
      <stop offset="80%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <linearGradient id="dtCircuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="dtTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="dtLetterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="dtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
    <filter id="dtTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Group Logo Graphic -->
  <g id="infinity-symbol" filter="url(#dtGlow)">
    <!-- Base Outer Ribbon of Infinity Loop (Lemniscate) -->
    <!-- Left Loop Outer & Inner: Center (160, 140), R_out=72, R_in=44 -->
    <!-- Right Loop Outer & Inner: Center (340, 140), R_out=72, R_in=44 -->
    <!-- Crossing at (250, 140) -->

    <!-- Back ribbon shadow layer -->
    <path d="M 250,140 
             C 285,188 305,212 340,212 
             C 380,212 412,180 412,140 
             C 412,100 380,68 340,68 
             C 305,68 285,92 250,140 
             C 215,188 195,212 160,212 
             C 120,212 88,180 88,140 
             C 88,100 120,68 160,68 
             C 195,68 215,92 250,140 Z"
          fill="none" 
          stroke="#082f49" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Main Gradient Ribbon -->
    <path d="M 250,140 
             C 285,188 305,212 340,212 
             C 380,212 412,180 412,140 
             C 412,100 380,68 340,68 
             C 305,68 285,92 250,140 
             C 215,188 195,212 160,212 
             C 120,212 88,180 88,140 
             C 88,100 120,68 160,68 
             C 195,68 215,92 250,140 Z"
          fill="none" 
          stroke="url(#dtTealGrad1)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Core Highlight Ribbon -->
    <path d="M 250,140 
             C 285,188 305,212 340,212 
             C 380,212 412,180 412,140 
             C 412,100 380,68 340,68 
             C 305,68 285,92 250,140 
             C 215,188 195,212 160,212 
             C 120,212 88,180 88,140 
             C 88,100 120,68 160,68 
             C 195,68 215,92 250,140 Z"
          fill="none" 
          stroke="url(#dtTealGrad2)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Outer Edge Border Outline for 3D metallic feel -->
    <path d="M 250,140 
             C 285,188 305,212 340,212 
             C 380,212 412,180 412,140 
             C 412,100 380,68 340,68 
             C 305,68 285,92 250,140 
             C 215,188 195,212 160,212 
             C 120,212 88,180 88,140 
             C 88,100 120,68 160,68 
             C 195,68 215,92 250,140 Z"
          fill="none" 
          stroke="#0f172a" 
          stroke-width="29" 
          stroke-opacity="0.3" />

    <!-- Circuit Data Tracks & Traces -->
    <!-- Left Loop Circuit Traces -->
    <path d="M 115,115 C 102,125 102,150 115,165" fill="none" stroke="url(#dtCircuitGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="115" cy="115" r="3" fill="#67e8f9" />
    <circle cx="115" cy="165" r="3" fill="#67e8f9" />

    <path d="M 130,85 C 145,76 175,76 190,88" fill="none" stroke="url(#dtCircuitGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="130" cy="85" r="2.5" fill="#67e8f9" />
    <circle cx="190" cy="88" r="2.5" fill="#67e8f9" />

    <path d="M 130,195 C 145,204 175,204 190,192" fill="none" stroke="url(#dtCircuitGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="130" cy="195" r="2.5" fill="#2dd4bf" />
    <circle cx="190" cy="192" r="2.5" fill="#2dd4bf" />

    <!-- Center Bridge Circuit Traces -->
    <path d="M 220,118 L 280,162" fill="none" stroke="url(#dtCircuitGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="230" cy="125" r="3" fill="#67e8f9" stroke="#082f49" stroke-width="1.5" />
    <circle cx="270" cy="155" r="3" fill="#67e8f9" stroke="#082f49" stroke-width="1.5" />

    <path d="M 220,162 L 280,118" fill="none" stroke="url(#dtCircuitGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6,4"/>

    <!-- Right Loop Circuit Traces -->
    <path d="M 385,115 C 398,125 398,150 385,165" fill="none" stroke="url(#dtCircuitGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="385" cy="115" r="3" fill="#2dd4bf" />
    <circle cx="385" cy="165" r="3" fill="#2dd4bf" />

    <path d="M 310,88 C 325,76 355,76 370,85" fill="none" stroke="url(#dtCircuitGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="310" cy="88" r="2.5" fill="#2dd4bf" />
    <circle cx="370" cy="85" r="2.5" fill="#2dd4bf" />

    <path d="M 310,192 C 325,204 355,204 370,195" fill="none" stroke="url(#dtCircuitGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="310" cy="192" r="2.5" fill="#67e8f9" />
    <circle cx="370" cy="195" r="2.5" fill="#67e8f9" />

    <!-- Loop Arrow Heads (Directional Cycling Flow) -->
    <!-- 1. Top Left Arrow (pointing right / into loop) -->
    <polygon points="175,56 195,68 175,80 180,68" fill="#22d3ee" stroke="#0f766e" stroke-width="1.5" />

    <!-- 2. Bottom Right Arrow (pointing left / into crossing) -->
    <polygon points="325,224 305,212 325,200 320,212" fill="#22d3ee" stroke="#0f766e" stroke-width="1.5" />

    <!-- 3. Top Right Outer Arrow (pointing clockwise / down right) -->
    <polygon points="405,122 417,144 425,120 417,128" fill="#14b8a6" stroke="#042f2e" stroke-width="1.5" />

    <!-- 4. Bottom Left Outer Arrow (pointing counter-clockwise / up left) -->
    <polygon points="95,158 83,136 75,160 83,152" fill="#14b8a6" stroke="#042f2e" stroke-width="1.5" />
  </g>

  <!-- Inner Letters 'D' and 'T' inside the loops -->
  <!-- Left Loop Inner Letter 'D' -->
  <g id="letter-D" filter="url(#dtTextGlow)">
    <text x="160" y="162" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="62" 
          font-weight="800" 
          fill="url(#dtLetterGrad)">D</text>
  </g>

  <!-- Right Loop Inner Letter 'T' -->
  <g id="letter-T" filter="url(#dtTextGlow)">
    <text x="340" y="162" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="62" 
          font-weight="800" 
          fill="url(#dtLetterGrad)">T</text>
  </g>

  <!-- Bottom Brand Typography: DEVTRACK -->
  <g id="brand-text" filter="url(#dtTextGlow)">
    <text x="250" y="295" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="9" 
          fill="url(#dtTextGrad)">DEVTRACK</text>
  </g>
</svg>
